allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: true
  duckdb: true
  esbuild: true
  vue-demi: true
# DuckDB's published package still requests node-gyp 9 and its vulnerable tar 6.
# Override the build tool rather than forcing tar 7 into tar 6's consumers.
# Keep fontless on its declared esbuild range until @nuxt/ui upgrades @nuxt/fonts.
overrides:
  'duckdb>node-gyp': ^13.1.0
minimumReleaseAgeExclude:
  - '@lucide/vue@1.64.0'
